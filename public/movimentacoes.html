<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Movimentações · Prateleira</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body>
<div class="app">
  <aside class="side">
    <a href="/" class="logo"><i></i>Prateleira</a>
    <a href="/app.html">Produtos</a>
    <a href="/movimentacoes.html" class="on">Movimentações</a>
    <a href="/relatorios.html">Relatórios</a>
    <a href="/logout" class="exit">Sair</a>
  </aside>
  <main class="main">
    <div class="head"><h1>Movimentações</h1></div>
    <div class="kpis" style="grid-template-columns:repeat(2,1fr)">
      <div class="card"><strong id="k-hoje">0</strong><span>Unidades vendidas hoje</span></div>
      <div class="card"><strong id="k-total">0</strong><span>Movimentações registradas</span></div>
    </div>
    <div class="card table-wrap">
      <table>
        <thead><tr><th>Data e hora</th><th>Produto</th><th>Entregue por</th><th>Recebido por</th><th>Tipo</th><th class="num">Quantidade</th></tr></thead>
        <tbody id="tabela"></tbody>
      </table>
    </div>
  </main>
</div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
(async()=>{
  const r=await fetch('/api/movimentacoes');
  if(r.status===401){location.href='/login.html';return}
  const ms=await r.json();
  const hoje=new Date().toLocaleDateString('pt-BR');
  $('k-hoje').textContent=ms.filter(m=>m.tipo==='venda'&&new Date(m.criado_em).toLocaleDateString('pt-BR')===hoje).reduce((t,m)=>t+m.quantidade,0);
  $('k-total').textContent=ms.length;
  $('tabela').innerHTML=ms.length?ms.map(m=>`<tr><td>${new Date(m.criado_em).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'medium'})}</td><td>${esc(m.produto_nome)}</td><td>${esc(m.entregue_por||'—')}</td><td>${esc(m.recebido_por||'—')}</td><td><span class="badge ${m.tipo==='entrada'?'b-ok':'b-info'}">${m.tipo==='entrada'?'Entrada':'Venda'}</span></td><td class="num">${m.tipo==='entrada'?'+':'−'}${m.quantidade}</td></tr>`).join(''):'<tr><td colspan="6">Nenhuma movimentação ainda. Use Vender ou Entrada na tela de Produtos.</td></tr>';
})();
</script>
</body></html>
