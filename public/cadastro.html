<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Criar conta · Prateleira</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body>
<div class="login-wrap">
  <aside class="login-side">
    <a href="index.html" class="logo"><i></i>Prateleira</a>
    <h2>Seu estoque em ordem, do balcão ao celular.</h2>
    <small>Feito para pequenos comércios.</small>
  </aside>
  <main class="login-form">
    <form class="card" id="form-cadastro">
      <h1>Criar conta</h1>
      <p class="sub">Informe e-mail e senha. Seus produtos ficam só na sua conta.</p>
      <label for="email">E-mail</label>
      <input id="email" type="email" placeholder="voce@loja.com" required>
      <label for="senha">Senha</label>
      <input id="senha" type="password" placeholder="Mínimo 6 caracteres" required>
      <p class="erro" id="erro" role="alert"></p>
      <button class="btn btn-primary" type="submit">Criar conta</button>
      <p class="small">Já tem conta? <a href="login.html">Entrar</a></p>
      <p class="small"><a href="index.html">Voltar para o início</a></p>
    </form>
  </main>
</div>
<script>
document.getElementById('form-cadastro').addEventListener('submit',async e=>{
  e.preventDefault();
  const erro=document.getElementById('erro');erro.textContent='';
  const r=await fetch('/api/registrar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,senha:document.getElementById('senha').value})});
  if(r.ok) location.href='/app.html';
  else erro.textContent=(await r.json().catch(()=>({}))).erro||'Não foi possível criar a conta.';
});
</script>
</body></html>
